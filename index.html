<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14161b">
<title>Trapwords Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* A torchlit dungeon table: the room track is the hero on the iPad; phones are the team's secret book. Single dark theme by choice. */
:root{
  --stone:#14161b; --slab:#1d2027; --slab-2:#262a33; --mortar:#363b47;
  --parch:#ece3d0; --dust:#9d9584; --torch:#e9a23b; --torch-deep:#b8741c;
  --teamA:#4db3a8; --teamB:#d8678d; --danger:#e0563f; --ok:#7fbf6a; --curse:#8f6bd6;
  --f-display:"Grenze Gotisch",Georgia,serif;
  --f-body:"Alegreya Sans",system-ui,-apple-system,sans-serif;
  --f-label:"Alegreya Sans SC","Alegreya Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stone);color:var(--parch);font-family:var(--f-body);font-size:17px;line-height:1.45;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(233,162,59,.13),transparent 60%);background-attachment:fixed;
  -webkit-tap-highlight-color:transparent}
#app{max-width:1100px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(2.2rem,6vw,3.4rem);line-height:1}
h2{font-size:clamp(1.6rem,4.5vw,2.4rem);line-height:1.05}
h3{font-size:1.4rem}
p{margin:0}
.label{font-family:var(--f-label);font-size:.82rem;letter-spacing:.1em;text-transform:lowercase;color:var(--dust)}
.hint{color:var(--dust);max-width:60ch}
.ta{color:var(--teamA)} .tb{color:var(--teamB)}
button{font:inherit;cursor:pointer;border-radius:10px;padding:13px 20px;font-weight:700;font-size:1.05rem;
  background:var(--slab-2);color:var(--parch);border:1px solid var(--mortar);touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--torch);outline-offset:2px}
button.primary{background:var(--torch);color:#21160a;border-color:var(--torch-deep);box-shadow:0 3px 0 var(--torch-deep)}
button.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--torch-deep)}
button.big{font-size:1.3rem;padding:18px 30px}
button.ghost{background:transparent}
button.bad{border-color:var(--danger);color:var(--danger);background:transparent}
button.good{background:var(--ok);border-color:#5a9a48;color:#10200b}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;color:var(--parch);background:var(--stone);border:1px solid var(--mortar);border-radius:8px;padding:11px 13px;width:100%;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}
.col{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--slab);border:1px solid var(--mortar);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:22px;height:22px;flex:none;margin-top:2px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.meta b{display:block;font-family:var(--f-display);font-size:1.6rem;color:var(--torch);line-height:1}
.code{font-family:var(--f-display);font-size:clamp(3rem,9vw,5rem);letter-spacing:.12em;color:var(--torch);line-height:1}
.netdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--danger);margin-right:6px}
.netdot.on{background:var(--ok)}

/* board */
.board{display:grid;gap:8px;overflow-x:auto}
.room{position:relative;background:var(--slab);border:1px solid var(--mortar);border-radius:10px;min-height:150px;padding:10px;
  display:flex;flex-direction:column;gap:8px;min-width:0;
  background-image:repeating-linear-gradient(0deg,transparent 0 23px,rgba(255,255,255,.025) 23px 24px)}
.room .n{font-family:var(--f-display);font-size:2.2rem;line-height:.9;color:var(--dust)}
.room.mon{background:linear-gradient(160deg,#3a1b18,var(--slab));border-color:#6b2e24}
.room.mon .n{color:var(--danger)}
.pieces{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tok{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:1.2rem;color:#101215;
  box-shadow:0 0 0 3px var(--stone)}
.tok.a{background:var(--teamA);box-shadow:0 0 0 3px var(--stone),0 0 14px var(--teamA)}
.tok.b{background:var(--teamB);box-shadow:0 0 0 3px var(--stone),0 0 14px var(--teamB)}
.monster{font-size:.82rem;font-weight:700;color:#fff;background:var(--danger);border-radius:6px;padding:3px 8px}
.cursecard{font-size:.8rem;font-weight:700;border-radius:6px;padding:3px 8px;border:1px solid var(--curse);color:#d9c9ff;background:#231b33}
.cursecard.down{color:var(--curse);letter-spacing:.1em}

/* screens */
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-block:12px}
.who{font-family:var(--f-label);letter-spacing:.12em;font-size:1rem}
.banner{border-radius:14px;padding:14px 18px;width:100%;text-align:center}
.banner.a{background:color-mix(in srgb,var(--teamA) 18%,var(--slab));border:1px solid var(--teamA)}
.banner.b{background:color-mix(in srgb,var(--teamB) 18%,var(--slab));border:1px solid var(--teamB)}
.secret{font-family:var(--f-display);font-size:clamp(3rem,13vw,6rem);line-height:1;color:var(--torch);word-break:break-word;text-shadow:0 0 30px rgba(233,162,59,.35)}
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;width:100%}
.traps label{display:flex;gap:8px;align-items:center}
.traps label span{font-family:var(--f-display);color:var(--dust);width:1.2em;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{border:1px dashed var(--mortar);border-radius:999px;padding:9px 16px;background:var(--slab);font-weight:700;font-size:1.05rem;color:var(--parch)}
.chip.hit{border:1px solid var(--danger);background:color-mix(in srgb,var(--danger) 30%,var(--slab))}
button.chip{border-style:solid;border-color:var(--danger)}
.rule{border:1px solid var(--curse);background:#1f1a2b;color:#e2d8fb;border-radius:10px;padding:10px 14px;text-align:left;max-width:620px;width:100%}
.rule.monr{border-color:#6b2e24;background:#2a1513;color:#f3c3b4}
.rule b{font-family:var(--f-display);font-size:1.2rem;display:block}
.timer{font-family:var(--f-display);font-size:clamp(5.5rem,24vw,12rem);line-height:.9;font-variant-numeric:tabular-nums}
.timer.sm{font-size:clamp(3rem,14vw,5rem)}
.timer.low{color:var(--danger)}
.bar{width:min(640px,100%);height:10px;border-radius:99px;background:var(--slab-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--torch)}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--dust)}
.dots i.x{background:var(--danger);border-color:var(--danger)}
.outs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.outs button[aria-pressed="true"]{background:var(--parch);color:var(--stone)}
.err{color:var(--danger);min-height:1.2em;font-weight:500}
.status{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pill{border-radius:999px;padding:6px 14px;border:1px solid var(--mortar);font-weight:700;font-size:.95rem}
.pill.done{border-color:var(--ok);color:var(--ok)}
.qr{background:#ece3d0;padding:10px;border-radius:10px;width:max-content}
.qr img,.qr canvas{display:block;max-width:100%}
.teamcard{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
details{color:var(--dust)} details summary{cursor:pointer;color:var(--parch);font-weight:700}
details ul,details ol{padding-left:1.2em;margin:.5em 0 0;display:flex;flex-direction:column;gap:5px;max-width:70ch}
.log{color:var(--dust);font-size:.95rem;display:flex;flex-direction:column;gap:3px}
.credit{text-align:center;color:var(--dust);font-size:.9rem;padding-top:6px}
.credit a{color:var(--torch);text-decoration:none;border-bottom:1px solid currentColor}
.roster{display:flex;flex-direction:column;gap:8px;width:100%}
.prow{display:flex;gap:8px;align-items:center}
.prow input{flex:1}
.prow button{padding:9px 12px;font-size:.95rem}
.online{width:10px;height:10px;border-radius:50%;flex:none;background:var(--mortar)}
.online.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.viewer{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.viewer .team{display:flex;flex-direction:column;gap:6px;background:var(--slab);border:1px solid var(--mortar);border-radius:12px;padding:12px 14px}
.viewer .team.a{border-color:color-mix(in srgb,var(--teamA) 60%,var(--mortar))}
.viewer .team.b{border-color:color-mix(in srgb,var(--teamB) 60%,var(--mortar))}
.pname{display:flex;align-items:center;gap:8px}
.pname .torch{font-size:.75rem;font-weight:700;color:#21160a;background:var(--torch);border-radius:5px;padding:1px 7px}
.overlay{position:fixed;inset:0;background:rgba(10,11,14,.88);z-index:20;display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay .panel{max-width:720px;width:100%;max-height:100%;overflow:auto}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--dust);font-size:.9rem}
@media (max-width:640px){ .room{min-height:110px;padding:7px} .room .n{font-size:1.6rem} .tok{width:28px;height:28px;font-size:.95rem} }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.89.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
/* ============================================================ data */
const WORDS = {
  fantasy: ["Goblin","Dragon","Wizard","Castle","Potion","Sword","Knight","Dungeon","Troll","Unicorn","Crown","Shield","Cauldron","Scroll","Tavern","Wand","Elf","Giant","Treasure","Spider","Skeleton","Ghost","Candle","Bridge","Forest","River","Horse","Bread","Cheese","Apple","Butter","Rope","Ladder","Key","Map","Chest","Mirror","Feather","Wolf","Bear","Owl","Raven","Snake","Frog","Mushroom","Moon","Star","Storm","Fire","Ice","Mountain","Cave","Tower","Gate","Bell","Coin","Ring","Necklace","Boots","Cloak","Hat","Beard","Horn","Arrow","Bow","Axe","Hammer","Anvil","Armor","Helmet","Banner","Throne","King","Queen","Princess","Witch","Spell","Fairy","Mermaid","Ship","Pirate","Island","Pig","Cow","Chicken","Egg","Milk","Honey","Soup","Pie","Carrot","Onion","Garden","Rose","Tree","Snow","Rain","Shadow","Bone","Tooth","Heart","Song","Harp","Drum","Book","Quill","Statue","Blacksmith","Bard","Catapult","Moat","Lantern","Broom","Cat","Goat","Sheep","Wheat","Mill","Well","Marsh","Swamp","Dwarf","Ogre","Phoenix","Griffin","Werewolf","Vampire","Zombie","Mummy","Jester","Thief","Monk","Priest","Feast","Barrel","Torch","Chain","Cage","Riddle","Prophecy","Amulet","Gem","Gold","Silver","Iron","Stone","Sand","Desert","Volcano","Thunder","Lightning","Wind"],
  normal: ["Toaster","Baseball","Phone","Computer","Car","Bus","Train","Airplane","Camera","Television","Guitar","Piano","Pizza","Hamburger","Sushi","Coffee","Chocolate","Ice cream","Umbrella","Backpack","Bicycle","Helicopter","Rocket","Astronaut","Robot","Doctor","Teacher","Police","Firefighter","Hospital","School","Library","Airport","Supermarket","Cinema","Beach","Swimming pool","Football","Basketball","Tennis","Golf","Yoga","Gym","Laptop","Keyboard","Headphones","Battery","Lightbulb","Fridge","Microwave","Washing machine","Vacuum","Sofa","Bed","Pillow","Blanket","Shower","Toothbrush","Soap","Towel","Glasses","Watch","Wallet","Passport","Ticket","Money","Newspaper","Magazine","Podcast","Video game","Internet","Email","Password","Selfie","Birthday","Wedding","Holiday","Sunscreen","Sunglasses","Taxi","Traffic","Skyscraper","Elevator","Escalator","Zoo","Giraffe","Penguin","Kangaroo","Elephant","Lion","Monkey","Shark","Dolphin","Octopus","Banana","Pineapple","Durian","Noodles","Rice","Chopsticks","Spoon","Fork","Plate","Cup","Bottle","Balloon","Fireworks","Earthquake","Rainbow","Tornado","Jungle","Snowman","Sandcastle","Tent","Campfire","Compass","Telescope","Microscope","Magnet","Scissors","Glue","Pencil","Eraser","Calculator","Clock","Alarm","Calendar","Envelope","Stamp","Gift","Pajamas","Sneakers","Jeans","Tie","Lipstick","Perfume","Haircut","Dentist","Pharmacy","Bakery","Restaurant","Waiter","Chef","Menu","Receipt","Shopping cart","Parking","Motorcycle","Submarine","Satellite","Planet","Dinosaur","Volcano","Hamster","Parrot","Goldfish"]
};
/* curse texts paraphrased from the rulebook's "Notes on selected curses" */
const CURSES = {
  flood:{name:"Flood",text:"Breathe normally while thinking of a clue. Then take a deep breath and give clues while holding it. Hold, clue, hold, clue... but once you inhale, even a tiny bit, you can give no more clues."},
  petrification:{name:"Petrification",text:"Once a teammate makes a guess, the clue-giver must freeze in a rigid pose, as if turned to stone."},
  echo:{name:"Echo",text:"The clue-giver must make a good-faith effort to echo every word they say. The other team should cut them a little slack; perfection isn't required."},
  feeblemind:{name:"Feeblemind",text:"The clue-giver can't use pronouns like “I” or “it”. Good luck!"}
};
const CURSE_IDS = Object.keys(CURSES);
const MONSTERS = {
  mummy:{name:"Mummy",official:true,text:"Draw a new curse for each round against the Mummy.",curses:1},
  mummy2:{name:"Mummy (nastier)",official:true,text:"Two curses at once for each round against the Mummy.",curses:2},
  ogre:{name:"Ogre",official:false,text:"House rule: your team gets only 3 guesses instead of 5.",guesses:3},
  banshee:{name:"Banshee",official:false,text:"House rule: the clue-giver may only whisper."},
  custom:{name:"Custom monster",official:false,text:""}
};
const LAYOUTS = { std:[3,4,5,6,7], alt:[2,4,6,8,10] };
const MAX_ROUNDS = 8, MAX_GUESSES = 5;
const PREFIX = "trapwords-table-";

/* ============================================================ utils */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet = k => { try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const lsDel = k => { try{ localStorage.removeItem(k); }catch(e){} };
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const tcls = t => t ? "tb" : "ta";
const poss = n => { n = String(n||""); return /s$/i.test(n) ? n+"\u2019" : n+"\u2019s"; };
const norm = s => String(s||"").trim().toLowerCase();

/* ============================================================ shared view helpers (use a state object s) */
const tname = (s,t) => `<span class="${tcls(t)}">${esc(s.names[t])}</span>`;
const playerList = (s,t) => ((s.roster && s.roster[t]) || []).map(p => String(p.name||"").trim()).filter(Boolean);
const clueGiver = (s,t) => { const l = playerList(s,t); return l.length ? l[s.torch[t] % l.length] : ""; };
const monsterOf = s => { const m = MONSTERS[s.cfg.monster] || MONSTERS.mummy; return s.cfg.monster==="custom" ? {...m, text: s.cfg.customRule || "No special rule entered."} : m; };
const guessLimit = (s,t) => (s.battle && s.battle[t] && monsterOf(s).guesses) || MAX_GUESSES;
function rulesFor(s,t){
  let h = "";
  (s.active?.[t]||[]).forEach(id => { const c=CURSES[id]; h += `<div class="rule"><b>Curse: ${esc(c.name)}</b>${esc(c.text)}</div>`; });
  if(s.battle?.[t]){
    const m = monsterOf(s);
    h += `<div class="rule monr"><b>Battling the ${esc(m.name)}</b>${esc(m.text)}${m.guesses?` (${m.guesses} guesses)`:""}</div>`;
    (s.monsterCurses?.[t]||[]).forEach(id => { const c=CURSES[id]; h += `<div class="rule"><b>${esc(poss(m.name))} curse: ${esc(c.name)}</b>${esc(c.text)}</div>`; });
  }
  return h;
}
function boardHTML(s){
  const n = s.rooms.length;
  let h = `<div class="board" style="grid-template-columns:repeat(${n},minmax(84px,1fr))">`;
  s.rooms.forEach((num,i) => {
    const toks = [0,1].map(t => s.pos[t]===i ? `<div class="tok ${t?'b':'a'}" title="${esc(s.names[t])}">${esc((s.names[t]||"?")[0].toUpperCase())}</div>` : "").join("");
    const mon = s.monsterIdx===i ? `<span class="monster">${esc(monsterOf(s).name)}</span>` : "";
    const cs = s.curses.filter(c=>c.idx===i).map(c => c.revealed ? `<span class="cursecard">${esc(CURSES[c.id].name)}</span>` : `<span class="cursecard down">curse ?</span>`).join("");
    h += `<div class="room ${s.monsterIdx===i?'mon':''}"><div class="n">${num}</div><div class="pieces">${toks}</div><div class="pieces">${mon}${cs}</div></div>`;
  });
  return h + `</div>`;
}
const RULES_HELP = `<details><summary>Legal traps &amp; clues (rulebook pp. 10&ndash;11)</summary><ul>
<li>Traps must be nouns, adjectives, verbs or numbers (not &ldquo;one&rdquo;). No pronouns or helping verbs (is, has, can), and not <i>one, thing, some, something, someone, blank</i>.</li>
<li>A trap triggers on any form of the word, either part of a compound (<i>baseball</i> &rarr; &ldquo;base&rdquo;), or inside a compound (<i>light</i> &rarr; &ldquo;daylight&rdquo;). Only if caught within about 3 seconds.</li>
<li>Clue-giver can't say any form of the secret word, give examples of it, use proper nouns or proper adjectives, or abbreviations of them.</li>
<li>Clues are about meaning, not sound or spelling. No gestures, tone or melody. No private in-jokes the other team can't know, and no pointing at things in the room.</li>
<li>Guessers can't ask questions or confer. A guess counts if it contains the secret word (&ldquo;hot dog&rdquo; for DOG); related forms like &ldquo;scientist&rdquo; for SCIENCE don't.</li>
<li>Traps only bind the clue-giver. Guessers may say trapwords.</li></ul></details>`;

/* ============================================================ network state */
let ROLE = null;            // "host" | "phone"
let S = null;               // host: authoritative state
let V = null;               // phone: last received state
/* realtime relay: Supabase Realtime broadcast + presence, one channel per game */
const SB_URL = "https://ddmwzowlovvfcztkinuf.supabase.co";
const SB_KEY = "sb_publishable_qW1kc8wPVdNtB_c0x3gYlg_N3yFAQdm";
let sb = null, chan = null, chanOK = false, presence = [];
let myTeam = 0, myName = "", myId = "", phoneCode = "", netState = "connecting", netMsg = "", showJoin = false;
let localEnd = 0;           // phone: local clock end time for the running timer
let pl = {key:"", step:"give"}; // phone-local step for the book hand-off
let joinErr = "";

/* ============================================================ audio / wake */
let actx = null, armed = false, wl = null;
function arm(){ if(armed) return; armed = true; try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} wake(); }
async function wake(){ try{ wl = await navigator.wakeLock?.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange", () => { if(armed && document.visibilityState==="visible") wake(); });
document.addEventListener("pointerdown", arm);
function beep(f=880,d=.12,v=.2){ if(!actx) return; try{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; g.gain.value=v; o.connect(g); g.connect(actx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d); o.stop(actx.currentTime+d+.02); }catch(e){} }

/* ============================================================ painting */
function paint(html){
  const a = document.activeElement, id = a && a.id;
  let val, ss, se;
  if(id && (a.tagName==="INPUT"||a.tagName==="TEXTAREA")){ val=a.value; try{ ss=a.selectionStart; se=a.selectionEnd; }catch(e){} }
  $("#app").innerHTML = html;
  if(id){ const n = document.getElementById(id); if(n){ if(val!==undefined) n.value = val; n.focus({preventScroll:true}); try{ if(ss!=null) n.setSelectionRange(ss,se); }catch(e){} } }
  document.querySelectorAll("[data-qr]").forEach(el => { try{ new QRCode(el,{text:el.dataset.qr,width:150,height:150,colorDark:"#14161b",colorLight:"#ece3d0"}); }catch(e){ el.textContent=""; } });
  tickUI();
}
const CREDIT = `<div class="credit">Created by Brian Goh, <a href="https://briangohjw.com" target="_blank" rel="noopener">briangohjw.com</a></div>`;
function render(){ const body = ROLE==="host" ? hostView() + (showJoin ? joinOverlay() : "") : ROLE==="phone" ? phoneView() : startView(); paint(body + CREDIT); }

/* ============================================================ start screen */
function startView(){
  const saved = lsGet(PREFIX+"host");
  return `<div class="top"><div><div class="label">a table game for two teams</div><h1>Trapwords Table</h1></div></div>
  <div class="grid2">

/* ============================================================ HOST: game logic */
function newCode(){ const L="abcdefghjkmnpqrstuvwxyz23456789"; let c=""; for(let i=0;i<10;i++) c+=L[Math.floor(Math.random()*L.length)]; return c; }
const newId = () => Math.random().toString(36).slice(2,10);
function freshState(code, keep){
  return { code, phase:"setup",
    cfg: keep?.cfg || {secs:60, words:"fantasy", layout:"std", curses:true, monster:"mummy", customRule:"", tiebreak:false},
    names: keep?.names || ["Lanterns","Torches"], roster: keep?.roster || [[],[]],
    rooms: LAYOUTS.std, pos:[0,0], monsterIdx:4, curses:[], torch:[0,0], round:1, glowStart:0,
    used:[], words:["",""], traps:[[],[]], ready:[false,false], battle:[false,false], active:[[],[]], monsterCurses:[[],[]],
    order:[0,1], turnIdx:0, turn:null, results:[null,null], usedTime:[null,null], notes:[], log:[], winners:[], monsterWon:false, v:0 };
}
function saveHost(){ lsSet(PREFIX+"host", S); }

function startGame(){
  const c = S.cfg;
  S.rooms = LAYOUTS[c.layout] || LAYOUTS.std;
  S.pos = [0,0]; S.monsterIdx = S.rooms.length-1; S.torch=[0,0]; S.round=1; S.used=[]; S.log=[]; S.winners=[]; S.monsterWon=false; S.notes=[];
  S.glowStart = Math.random()<.5 ? 0 : 1;
  S.curses = [];
  if(c.curses){
    const ids = shuffle(CURSE_IDS);
    const spots = c.layout==="alt" ? [0,1,2,3] : [1, S.monsterIdx-1];   // rulebook p.2 / p.3
    spots.forEach((idx,k) => S.curses.push({id:ids[k], idx, revealed:false}));
  }
  startRound();
}
function drawWord(){
  const list = WORDS[S.cfg.words] || WORDS.fantasy;
  const pool = list.filter(w => !S.used.includes(w));
  const w = pick(pool.length ? pool : list); S.used.push(w); return w;
}
function startRound(){
  S.battle = [0,1].map(t => S.pos[t]===S.monsterIdx);
  S.words = [drawWord(), drawWord()];                         // words[t] = the word team t must guess
  S.traps = [0,1].map(t => Array(S.rooms[S.pos[t]]).fill("")); // traps against team t = number on team t's room
  S.ready = [false,false];                                    // ready[t] = traps against t are done
  S.results = [null,null]; S.usedTime=[null,null];
  S.active = [[],[]];
  S.curses.forEach(c => [0,1].forEach(t => { if(c.idx===S.pos[t]){ c.revealed = true; S.active[t].push(c.id); } }));
  const m = monsterOf(S);
  S.monsterCurses = [0,1].map(t => S.battle[t] && m.curses ? shuffle(CURSE_IDS).slice(0,m.curses) : []);
  // who goes first: team behind; if level, the team receiving the glowing book (alternates each round)
  if(S.pos[0] !== S.pos[1]) S.order = S.pos[0] < S.pos[1] ? [0,1] : [1,0];
  else { const g = (S.glowStart + S.round - 1) % 2; S.order = [g, 1-g]; }
  S.turnIdx = 0; S.turn = null; S.phase = "traps";
}
function beginTurn(){
  const d = S.order[S.turnIdx];
  let limit = S.cfg.secs;
  const first = S.order[0];
  if(S.cfg.tiebreak && S.battle[0] && S.battle[1] && S.turnIdx===1 && S.results[first]===true)
    limit = Math.max(1, Math.round(S.usedTime[first]));       // alternative tiebreaker (p.9)
  S.turn = {d, guesses:0, glimit:guessLimit(S,d), limit, remain:limit, endAt:0, paused:false, outcome:null, reason:"", sprung:-1, used:0};
  S.phase = "read";
}
function remainNow(){
  const t = S.turn; if(!t) return 0;
  if(S.phase!=="run" || t.paused) return t.remain;
  return Math.max(0, (t.endAt - Date.now())/1000);
}
function finishTurn(outcome, reason, sprung=-1){
  const t = S.turn; if(!t || S.phase!=="run") return;
  const rem = remainNow();
  t.used = t.limit - rem; t.remain = rem; t.outcome = outcome; t.reason = reason; t.sprung = sprung;
  S.phase = "result";
  outcome==="win" ? beep(1200,.25,.25) : beep(200,.5,.3);
}
function continueTurn(){
  const t = S.turn, d = t.d, ok = t.outcome==="win";
  S.results[d] = ok; S.usedTime[d] = t.used;
  const giver = clueGiver(S,d);
  let line = `R${S.round}: ${S.names[d]}${giver?` (${giver})`:""} ${ok ? "guessed" : "missed"} "${S.words[d]}"${ok?"":`, ${t.reason}`}.`;
  if(ok && !S.battle[d]){ S.pos[d] = Math.min(S.pos[d]+1, S.monsterIdx); line += ` Advanced to room ${S.rooms[S.pos[d]]}.`; }
  S.log.push(line);
  S.turnIdx++;
  if(S.turnIdx < 2) beginTurn(); else endRound();
}
function pushCurse(idx){
  const c = S.curses.find(c => c.idx===idx); if(!c) return;
  if(idx-1 < 0){ S.curses = S.curses.filter(x => x!==c); return; }
  pushCurse(idx-1); c.idx = idx-1;
}
function endRound(){
  const notes = [];
  let winners = [0,1].filter(t => S.battle[t] && S.results[t]);
  if(S.cfg.tiebreak && winners.length===2) winners = [S.order[1]];
  if(winners.length){ S.winners = winners; S.phase = "over"; return; }
  // discard curses that were in play this round (p.8)
  const applied = new Set([...S.active[0], ...S.active[1]]);
  if(applied.size){ S.curses = S.curses.filter(c => !applied.has(c.id)); notes.push(`Discarded curse${applied.size>1?"s":""}: ${[...applied].map(id=>CURSES[id].name).join(", ")}.`); }
  if(!S.results.some(Boolean)){
    if(S.pos.includes(S.monsterIdx)) notes.push(`Nobody advanced. The ${monsterOf(S).name} stays put while a team is in its room.`);
    else {
      const to = S.monsterIdx-1;
      const pushed = S.curses.some(c => c.idx===to);
      pushCurse(to); S.monsterIdx = to;
      notes.push(`Nobody advanced, so the ${monsterOf(S).name} moves into room ${S.rooms[to]}.${pushed?" A curse there was pushed toward you.":""}`);
    }
  }
  [0,1].forEach(t => { if(S.pos[t]===S.monsterIdx && !S.battle[t]) notes.push(`${S.names[t]} reached the ${monsterOf(S).name} and battle it next round.`); });
  S.torch = S.torch.map(x => x+1);
  if(S.round >= MAX_ROUNDS){ S.monsterWon = true; S.winners = []; S.phase = "over"; S.notes = notes; return; }
  S.round++; S.notes = notes; S.phase = "roundEnd";
}

/* actions: from host UI or from phones (fromTeam set) */
const HOST_ONLY = new Set(["add-player","rm-player","up-player","start-game","fix","continue","next-round","pause","new-game","host-correct","host-fail","back-setup"]);
function act(m, fromTeam){
  if(!S) return;
  const a = m.a;
  if(fromTeam!==undefined && HOST_ONLY.has(a)) return;
  switch(a){
    case "add-player": S.roster[m.t].push({id:newId(), name:"", phone:false}); break;
    case "rm-player": S.roster[m.t].splice(m.i,1); break;
    case "up-player": if(m.i>0){ const r=S.roster[m.t]; [r[m.i-1],r[m.i]]=[r[m.i],r[m.i-1]]; } break;
    case "start-game": if(S.phase==="setup") startGame(); break;
    case "trap": if(S.phase==="traps" && !S.ready[m.t] && Number.isInteger(m.i) && m.i>=0 && m.i<S.traps[m.t].length){ S.traps[m.t][m.i] = String(m.v||"").slice(0,40); } break;
    case "ready":
      if(S.phase!=="traps") break;
      if(m.on){
        const tr = S.traps[m.t].map(norm);
        if(tr.some(x=>!x) || tr.includes(norm(S.words[m.t])) || new Set(tr).size!==tr.length) break;
      }
      S.ready[m.t] = !!m.on;
      if(S.ready[0] && S.ready[1]) beginTurn();
      break;
    case "start": if(S.phase==="read"){ S.turn.endAt = Date.now()+S.turn.remain*1000; S.phase="run"; beep(660,.15); } break;
    case "wrong": if(S.phase==="run"){ S.turn.guesses++; if(S.turn.guesses >= S.turn.glimit) finishTurn("fail", `${S.turn.glimit} wrong guesses`); } break;
    case "unwrong": if(S.phase==="run" && S.turn.guesses>0) S.turn.guesses--; break;
    case "correct": case "host-correct": if(S.phase==="run") finishTurn("win","Guessed it"); break;
    case "sprung": if(S.phase==="run"){ const i = Number.isInteger(m.i)?m.i:-1; finishTurn("fail", i>=0 ? `said trapword “${S.traps[S.turn.d][i]}”` : "said a trapword", i); } break;
    case "illegal": if(S.phase==="run") finishTurn("fail","gave an illegal clue"); break;
    case "host-fail": if(S.phase==="run") finishTurn("fail","stopped by the table"); break;
    case "pause":
      if(S.phase==="run"){ const t=S.turn; if(t.paused){ t.endAt=Date.now()+t.remain*1000; t.paused=false; } else { t.remain=remainNow(); t.paused=true; } }
      break;
    case "fix":
      if(S.phase==="result"){
        const t=S.turn; t.outcome = m.o==="win" ? "win" : "fail";
        t.reason = m.o==="win" ? "Guessed it" : m.o==="trap" ? (m.i>=0 ? `said trapword “${S.traps[t.d][m.i]}”` : "said a trapword") : m.o==="time" ? "time ran out" : m.o==="five" ? `${t.glimit} wrong guesses` : "gave an illegal clue";
        t.sprung = m.o==="trap" ? (m.i ?? -1) : -1; t.fix = m.o;
      } break;
    case "continue": if(S.phase==="result") continueTurn(); break;
    case "next-round": if(S.phase==="roundEnd") startRound(); break;
    case "new-game": S = freshState(S.code, S); break;
    case "back-setup": if(S.phase==="setup") break; S = freshState(S.code, S); break;
    default: return;
  }
  broadcast();
}

/* ============================================================ HOST: networking */
function hostStart(code, resume){
  ROLE = "host";
  S = resume || freshState(code);
  if(!Array.isArray(S.roster)) S.roster = [[],[]];
  saveHost(); render();
  connectHost(S.code);
}
function sbClient(){
  if(sb) return sb;
  if(!window.supabase || !window.supabase.createClient) return null;
  sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}, realtime:{params:{eventsPerSecond:30}}});
  return sb;
}
function closeChannel(){ if(chan && sb){ try{ sb.removeChannel(chan); }catch(e){} } chan = null; chanOK = false; presence = []; }
function openChannel(code, key, meta, onMsg, onReady){
  const c = sbClient();
  if(!c){ netState="error"; netMsg="Couldn't load the connection library. Check the internet connection and reload."; render(); return; }
  closeChannel();
  const ch = c.channel("trapwords-" + code, {config:{broadcast:{self:false, ack:false}, presence:{key}}});
  ch.on("broadcast", {event:"m"}, ({payload}) => { if(payload && typeof payload==="object") onMsg(payload); });
  ch.on("presence", {event:"sync"}, () => {
    const st = ch.presenceState(); presence = [];
    Object.values(st).forEach(metas => { const m = metas[metas.length-1]; if(m) presence.push(m); });
    render();
  });
  ch.subscribe(async status => {
    if(ch!==chan) return;
    if(status==="SUBSCRIBED"){ chanOK = true; netState="on"; netMsg=""; try{ await ch.track(meta()); }catch(e){} onReady(); }
    else { chanOK = false; netState = status==="CLOSED" ? "connecting" : "error";
      netMsg = status==="TIMED_OUT" ? "Connection timed out. Retrying…" : status==="CHANNEL_ERROR" ? "Connection problem. Retrying…" : "Reconnecting…"; }
    render();
  });
  chan = ch;
}
function chanSend(payload){ if(!chan || !chanOK) return; try{ chan.send({type:"broadcast", event:"m", payload}); }catch(e){} }
function connectHost(code){
  netState = "connecting"; netMsg = ""; render();
  openChannel(code, "host", () => ({host:true}), d => {
    if(d.type==="hello"){
      const team = d.team===1 ? 1 : 0, pid = String(d.pid||"").slice(0,20), name = String(d.name||"").trim().slice(0,20);
      if(pid && name) upsertPlayer(pid, name, team);
      broadcast();
    }
    else if(d.type==="act"){ act(d, d.from===1 ? 1 : 0); }
  }, () => broadcast());
}
function upsertPlayer(pid, name, team){
  let found = null;
  [0,1].forEach(t => { const i = S.roster[t].findIndex(p => p.id===pid); if(i>=0){ found = S.roster[t][i]; if(t!==team) S.roster[t].splice(i,1); } });
  if(found){ found.name = name; if(!S.roster[team].includes(found)) S.roster[team].push(found); }
  else S.roster[team].push({id:pid, name, phone:true});
}
function onlineIds(){ return new Set(presence.filter(m => m.pid).map(m => m.pid)); }
function stateMsg(){ return {type:"state", s:S, remain:remainNow()}; }
function broadcast(){ S.v++; saveHost(); chanSend(stateMsg()); render(); }

}

    </div>${hostFoot()}`;
  }
  if(s.phase==="run"){
    const t = s.turn, d = t.d;
    return `<div class="screen">
      <div class="who ${tcls(d)}">${esc(s.names[d])} guessing</div>
      <p class="hint">${clueGiver(s,d)?`${esc(clueGiver(s,d))} gives clues. `:""}${s.traps[d].length} trap${s.traps[d].length>1?"s are":" is"} set.</p>
      ${rulesFor(s,d)}
      <div class="timer" id="timer">${Math.ceil(remainNow())}</div>
      <div class="bar"><i id="bar"></i></div>
      <div class="label">wrong guesses</div>
      <div class="dots">${Array.from({length:t.glimit},(_,i)=>`<i class="${i<t.guesses?'x':''}"></i>`).join("")}</div>
      <p class="hint">${tname(s,1-d)} judge on their phone: count wrong guesses, call traps and illegal clues.</p>
      <div class="outs"><button class="good" data-a="host-correct">Guessed it</button><button class="bad" data-a="host-fail">Stop: failed</button>
      <button class="ghost" data-a="pause">${t.paused?"Resume":"Pause"}</button></div>
    </div>${hostFoot()}`;
  }
  if(s.phase==="result"){
    const t = s.turn, d = t.d, ok = t.outcome==="win";
    const battleWin = ok && s.battle[d];
    const cur = t.fix || (ok?"win": t.sprung>=0||/trapword/.test(t.reason)?"trap": /time/.test(t.reason)?"time": /wrong/.test(t.reason)?"five":"illegal");
    return `<div class="screen">
      <div class="label">${esc(poss(s.names[d]))} word was</div><div class="secret">${esc(s.words[d])}</div>
      <h2 style="color:${ok?'var(--ok)':'var(--danger)'}">${ok ? (battleWin ? `${esc(s.names[d])} defeat the ${esc(monsterOf(s).name)}!` : "Guessed! Advance one room.") : `Failed: ${esc(t.reason)}`}</h2>
      <div class="label">${esc(poss(s.names[1-d]))} traps${ok?"":" (tap one if a trap was sprung)"}</div>
      <div class="chips">${s.traps[d].map((x,i)=>`<button class="chip ${t.sprung===i?'hit':''}" data-a="fix" data-o="trap" data-i="${i}">${esc(x)}</button>`).join("")}</div>
      <div class="label">not sure? discuss and fix it (statute of limitations, p.10)</div>
      <div class="outs">${[["win","Guessed"],["trap","Trapword"],["illegal","Illegal clue"],["five",`${t.glimit} wrong guesses`],["time","Time ran out"]].map(([k,l])=>`<button data-a="fix" data-o="${k}" aria-pressed="${cur===k}">${l}</button>`).join("")}</div>
      <button class="primary big" data-a="continue">${s.turnIdx===0?`Next: ${esc(poss(s.names[s.order[1]]))} turn`:"End the round"}</button>
    </div>`;
  }
  if(s.phase==="roundEnd"){
    return `${hostTop()}${boardHTML(s)}
    <div class="panel" style="align-items:center;text-align:center">
      <h2>Round ${s.round-1} is over</h2>
      ${s.notes.length?`<div class="col">${s.notes.map(n=>`<p>${esc(n)}</p>`).join("")}</div>`:""}
      <p class="hint">Clue-givers pass the torch to the next player.${[0,1].map(t=>clueGiver(s,t)?` ${esc(s.names[t])}: ${esc(clueGiver(s,t))}.`:"").join("")}</p>
      <button class="primary big" data-a="next-round">Start round ${s.round}</button>
      <div class="log">${s.log.slice(-4).map(l=>`<span>${esc(l)}</span>`).join("")}</div>
    </div>${hostFoot()}`;
  }
  if(s.phase==="over"){
    const w = s.winners;
    const head = s.monsterWon ? `The ${esc(monsterOf(s).name)} wins` : w.length===2 ? "Both teams win!" : `${tname(s,w[0])} win!`;
    return `${boardHTML(s)}<div class="screen">
      <div class="label">${s.monsterWon ? `no one escaped in ${MAX_ROUNDS} rounds` : "the monster is defeated"}</div>
      <h1 style="font-size:clamp(2.6rem,9vw,5rem)">${head}</h1>
      <div class="log">${s.log.map(l=>`<span>${esc(l)}</span>`).join("")}</div>
      <button class="primary big" data-a="new-game">Play again</button></div>${hostFoot()}`;
  }
  return "";
}

/* ============================================================ PHONE */
function phoneJoin(code, team){
  ROLE = "phone"; phoneCode = code; myTeam = team; V = null;
  const me = lsGet(PREFIX+"me") || {};
  myId = me.id || newId(); myName = me.name || "";
  lsSet(PREFIX+"me", {id:myId, name:myName});
  lsSet(PREFIX+"phone", {code, team});
  history.replaceState(null, "", location.pathname);
  render();
  netState = "connecting"; netMsg = ""; render();
  openChannel(code, myId, () => ({pid:myId, team:myTeam, name:myName}), d => {
    if(d.type!=="state" || !d.s) return;
    const prevPhase = V?.phase; V = d.s;
    if(V.phase==="run" && !V.turn.paused) localEnd = Date.now() + d.remain*1000;
    if(prevPhase!=="run" && V.phase==="run") beep(660,.12);
    render();
  }, () => hello());
}
let phoneOnline = { has: id => presence.some(m => m.pid===id) };
const hostHere = () => presence.some(m => m.host);
function retrack(){ if(chan && chanOK){ try{ chan.track({pid:myId, team:myTeam, name:myName}); }catch(e){} } }
function hello(){ chanSend({type:"hello", team:myTeam, pid:myId, name:myName}); }
function send(a, extra={}){ chanSend({type:"act", from:myTeam, a, ...extra}); }
// keep knocking until the table answers (covers the iPad opening after the phone)
setInterval(() => { if(ROLE==="phone" && chanOK && !V) hello(); }, 2500);
let hostWasHere = false;
setInterval(() => { if(ROLE!=="phone") return; const h = hostHere(); if(h && !hostWasHere) hello(); hostWasHere = h; }, 1000);
const trapTimers = {};
function sendTrap(t,i,v){ clearTimeout(trapTimers[i]); trapTimers[i] = setTimeout(() => send("trap",{t,i,v}), 200); }
function phoneRemain(){ const s=V; if(!s?.turn) return 0; if(s.phase!=="run"||s.turn.paused) return s.turn.remain; return Math.max(0,(localEnd-Date.now())/1000); }

function phoneView(){
  const s = V, T = myTeam, O = 1-T;
  const teamName = s ? s.names[T] : (T ? "the second team" : "the first team");
  const head = (inner) => `<div class="foot"><span><span class="netdot ${netState==="on" && hostHere()?"on":""}"></span>${netState!=="on" ? esc(netMsg || "Connecting…") : hostHere() ? "Connected" : "Waiting for the table iPad…"}</span>
      <span class="${tcls(T)}">${myName ? `${esc(myName)} on ${esc(teamName)}` : esc(teamName)}</span><button class="ghost" data-a="leave" style="padding:6px 12px;font-size:.9rem">Leave</button></div>${inner}`;
  if(!myName) return head(`<div class="screen"><div class="who ${tcls(T)}">joining ${esc(teamName)}</div><h2>What's your name?</h2>
      <input id="myname" maxlength="20" autocomplete="given-name" placeholder="Your name" style="max-width:360px;font-size:1.3rem;text-align:center">
      <button class="primary big" data-a="set-name">Join ${esc(teamName)}</button><div class="err" id="err"></div></div>`);
  if(!s) return head(`<div class="screen"><h2>Joining the table…</h2><p class="hint">${esc(netMsg || "Keep the iPad open on the game.")}</p></div>`);
  if(s.phase==="setup") return head(`<div class="screen"><div class="who ${tcls(T)}">you're on</div><h1 class="${tcls(T)}">${esc(s.names[T])}</h1>
      <p class="hint">Waiting for the iPad to start the game.</p>
      <div class="viewer" style="width:100%;text-align:left">${[0,1].map(t => { const ps = (s.roster[t]||[]).filter(p => String(p.name||"").trim());
        return `<div class="team ${t?'b':'a'}"><div class="label ${tcls(t)}">${esc(s.names[t])}</div>${ps.map(p => `<div class="pname"><span class="online ${p.phone && phoneOnline.has(p.id) ? "on" : ""}"></span><span>${esc(p.name)}${p.id===myId?" (you)":""}</span></div>`).join("") || `<span class="hint">Nobody yet</span>`}</div>`; }).join("")}</div>
      <button class="ghost" data-a="switch-team">Switch to ${esc(s.names[O])}</button>
      ${RULES_HELP}</div>`);

  if(s.phase==="traps"){
    const n = s.traps[O].length, done = s.ready[O];
    let me = `<div class="banner ${T?'b':'a'}"><div class="who">round ${s.round}, keep this screen to ${esc(s.names[T])}</div><h2>Trap ${tname(s,O)}</h2></div>
      <div class="label">their secret word</div><div class="secret">${esc(s.words[O])}</div>
      ${clueGiver(s,O)?`<p class="hint">Their clue-giver is <b>${esc(clueGiver(s,O))}</b>. Use what you know about them.</p>`:""}
      ${rulesFor(s,O)}
      <div class="label">${n} trapword${n>1?"s":""} (their room is ${s.rooms[s.pos[O]]})</div>`;
    if(!done){
      me += `<div class="traps">${s.traps[O].map((v,i)=>`<label><span>${i+1}</span><input id="tr${i}" data-in="trap" data-i="${i}" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(v)}"></label>`).join("")}</div>
        <div class="err" id="err"></div>
        <button class="primary big" data-a="ready">Our list is done</button>`;
    } else {
      me += `<div class="chips">${s.traps[O].map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>
        <p class="hint">Locked in. ${s.ready[T] ? "Both teams are done." : `Waiting for ${esc(s.names[O])} to finish your traps.`}</p>
        <button class="ghost" data-a="unready">Edit our list</button>`;
    }
    return head(`<div class="screen" style="justify-content:flex-start">${me}${RULES_HELP}</div>`);
  }

  if(s.phase==="read" || s.phase==="run"){
    const t = s.turn, d = t.d;
    const key = `${s.round}-${s.turnIdx}`;
    if(pl.key!==key) pl = {key, step:"give"};
    if(d===O){ // we hold the book for the other team
      if(s.phase==="read"){
        if(pl.step==="give") return head(`<div class="screen"><div class="who ${tcls(d)}">${esc(poss(s.names[d]))} turn</div>
          <h2>Hand this phone to ${clueGiver(s,d)?`<span class="${tcls(d)}">${esc(clueGiver(s,d))}</span>`:`<span class="${tcls(d)}">${esc(poss(s.names[d]))}</span> clue-giver`}</h2>
          <p class="hint">Only the clue-giver looks. They'll see the word, never your traps.</p>
          <button class="primary big" data-a="pl-show">I'm the clue-giver: show me the word</button></div>`);
        if(pl.step==="show") return head(`<div class="screen"><div class="label">your secret word</div><div class="secret">${esc(s.words[d])}</div>
          <p class="hint">${s.traps[d].length} hidden trap${s.traps[d].length>1?"s":""}. Any form of the word itself is off-limits too.</p>
          ${rulesFor(s,d)}
          <button class="primary big" data-a="pl-hide">Got it, hide the word</button></div>`);
        return head(`<div class="screen"><h2>Take your phone back</h2><p class="hint">Start the timer once ${esc(clueGiver(s,d)||"the clue-giver")} has read and understood the word.</p>
          <button class="primary big" data-a="start">Start timer</button>
          <button class="ghost" data-a="pl-show">Clue-giver needs another look</button></div>`);
      }
      return head(`<div class="screen" style="gap:14px">
        <div class="who ${tcls(d)}">you're judging ${esc(s.names[d])}</div>
        <p class="hint">Their word is <b>${esc(s.words[d])}</b>.</p>
        <div class="timer sm" id="timer">${Math.ceil(phoneRemain())}</div>
        <div class="bar"><i id="bar"></i></div>
        <div class="label">listen for your traps (tap the one they said)</div>
        <div class="chips">${s.traps[d].map((x,i)=>`<button class="chip" data-a="sprung" data-i="${i}">${esc(x)}</button>`).join("")}</div>
        <div class="dots">${Array.from({length:t.glimit},(_,i)=>`<i class="${i<t.guesses?'x':''}"></i>`).join("")}</div>
        <div class="outs"><button class="big" data-a="wrong">Wrong guess (${t.guesses}/${t.glimit})</button><button class="ghost" data-a="unwrong" ${t.guesses?"":"disabled"}>Undo</button></div>
        <div class="outs"><button class="good big" data-a="correct">They guessed it</button><button class="bad" data-a="illegal">Illegal clue</button></div>
      </div>`);
    }
    // our team is giving clues
    return head(`<div class="screen">
      <div class="who ${tcls(T)}">your turn</div>
      <h2>${clueGiver(s,T)?`${esc(clueGiver(s,T))} gives clues`:"Your clue-giver gives clues"}</h2>
      ${s.phase==="read" ? `<p class="hint">${tname(s,O)} will hand their phone to your clue-giver.</p>` :
        `<div class="timer sm" id="timer">${Math.ceil(phoneRemain())}</div><div class="bar"><i id="bar"></i></div>
         <div class="dots">${Array.from({length:t.glimit},(_,i)=>`<i class="${i<t.guesses?'x':''}"></i>`).join("")}</div>
         <p class="hint">Shout guesses. ${t.glimit} guesses allowed, no questions, no conferring.</p>`}
      ${rulesFor(s,T)}</div>`);
  }

  if(s.phase==="result"){
    const t = s.turn, d = t.d, ok = t.outcome==="win";
    return head(`<div class="screen"><div class="label">${esc(poss(s.names[d]))} word was</div><div class="secret">${esc(s.words[d])}</div>
      <h2 style="color:${ok?'var(--ok)':'var(--danger)'}">${ok?"Guessed!":`Failed: ${esc(t.reason)}`}</h2>
      <div class="label">${esc(poss(s.names[1-d]))} traps</div>
      <div class="chips">${s.traps[d].map((x,i)=>`<span class="chip ${t.sprung===i?'hit':''}">${esc(x)}</span>`).join("")}</div>
      <p class="hint">Disagree? Discuss it, then fix the result on the iPad.</p></div>`);
  }
  if(s.phase==="roundEnd") return head(`<div class="screen"><h2>Round ${s.round-1} is over</h2>${s.notes.map(n=>`<p>${esc(n)}</p>`).join("")}
      <p class="hint">${clueGiver(s,T)?`Next clue-giver for ${esc(s.names[T])}: <b>${esc(clueGiver(s,T))}</b>. `:"Pass the torch to your next clue-giver. "}Waiting for the iPad to start round ${s.round}.</p></div>`);
  if(s.phase==="over"){
    const w = s.winners;
    const head2 = s.monsterWon ? `The ${esc(monsterOf(s).name)} wins` : w.length===2 ? "Both teams win!" : w.includes(T) ? "You win!" : `${esc(s.names[w[0]])} win`;
    return head(`<div class="screen"><h1>${head2}</h1><p class="hint">Start a new game from the iPad.</p></div>`);
  }
  return head("");
}

/* ============================================================ timers */
let lastBeepSec = -1;
function tickUI(){
  let rem, total;
  if(ROLE==="host" && S?.phase==="run"){ rem = remainNow(); total = S.turn.limit; }
  else if(ROLE==="phone" && V?.phase==="run"){ rem = phoneRemain(); total = V.turn.limit; }
  else return;
  const el = $("#timer"), bar = $("#bar");
  if(el){ el.textContent = Math.ceil(rem); el.classList.toggle("low", rem<=10); }
  if(bar) bar.style.width = Math.max(0, rem/total*100) + "%";
  return rem;
}
setInterval(() => {
  const rem = tickUI();
  if(ROLE==="host" && S?.phase==="run" && !S.turn.paused){
    const sec = Math.ceil(rem);
    if(sec<=5 && sec>0 && sec!==lastBeepSec){ lastBeepSec = sec; beep(990,.08,.15); }
    if(rem<=0) { lastBeepSec=-1; finishTurn("fail","time ran out"); broadcast(); }
  }
}, 200);
// keep phones' clocks honest during long turns
setInterval(() => { if(ROLE==="host" && S?.phase==="run") chanSend(stateMsg()); }, 5000);

/* ============================================================ events */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if(!b) return;
  const a = b.dataset.a, i = b.dataset.i!==undefined ? +b.dataset.i : undefined;
  if(a==="host-new"){ lsDel(PREFIX+"host"); hostStart(newCode()); return; }
  if(a==="host-resume"){ const s = lsGet(PREFIX+"host"); if(s) hostStart(s.code, s); return; }
  if(ROLE==="host"){
    if(a==="ask-new"){ $("#ng").innerHTML = `<span class="row"><span>End this game?</span><button class="bad" data-a="new-game">Yes, back to setup</button><button class="ghost" data-a="cancel-new">No</button></span>`; return; }
    if(a==="cancel-new"){ render(); return; }
    if(a==="show-join"){ showJoin = true; render(); return; }
    if(a==="hide-join"){ showJoin = false; render(); return; }
    if(a==="fix"){ act({a, o:b.dataset.o, i: i ?? -1}); return; }
    act({a, i, t: b.dataset.t!==undefined ? +b.dataset.t : undefined}); return;
  }
  if(ROLE==="phone"){
    const s = V, O = 1-myTeam;
    if(a==="leave"){ lsDel(PREFIX+"phone"); closeChannel(); ROLE=null; V=null; render(); return; }
    if(a==="set-name"){
      const v = ($("#myname")?.value||"").trim().slice(0,20);
      if(!v){ $("#err").textContent = "Type your name so your team can see you joined."; return; }
      myName = v; lsSet(PREFIX+"me", {id:myId, name:myName}); arm(); retrack(); hello(); render(); return;
    }
    if(a==="switch-team"){ myTeam = 1-myTeam; lsSet(PREFIX+"phone", {code:phoneCode, team:myTeam}); retrack(); hello(); render(); return; }
    if(a==="pl-show"){ pl.step="show"; render(); return; }
    if(a==="pl-hide"){ pl.step="back"; render(); return; }
    if(a==="ready"){
      const vals = s.traps[O].map((_,k) => ($("#tr"+k)?.value||"").trim());
      const low = vals.map(norm), err = $("#err");
      if(low.some(x=>!x)) return err.textContent = "Fill in every trap.";
      if(low.includes(norm(s.words[O]))) return err.textContent = "The secret word itself is already off-limits. Pick another trap.";
      if(new Set(low).size!==low.length) return err.textContent = "Two traps are the same.";
      vals.forEach((v,k) => send("trap",{t:O,i:k,v}));
      send("ready",{t:O,on:true}); return;
    }
    if(a==="unready"){ send("ready",{t:O,on:false}); return; }
    if(a==="start"){ arm(); send("start"); return; }
    if(a==="sprung"){ send("sprung",{i}); return; }
    send(a, {i});
  }
});
document.addEventListener("input", e => {
  const el = e.target, k = el.dataset.in; if(!k) return;
  if(ROLE==="host" && S){
    if(k==="name"){ S.names[+el.dataset.t] = el.value.slice(0,16) || (el.dataset.t==="1"?"Torches":"Lanterns"); }
    else if(k==="rname"){ const p = S.roster[+el.dataset.t][+el.dataset.i]; if(p) p.name = el.value.slice(0,20); }
    else if(k==="cfg"){ S.cfg[el.dataset.k] = el.dataset.k==="secs" ? +el.value : el.value; if(el.tagName==="SELECT"){ broadcast(); return; } }
    else if(k==="cfgb"){ S.cfg[el.dataset.k] = el.checked; }
    clearTimeout(window.__bt); window.__bt = setTimeout(broadcast, 400);
  }
  if(ROLE==="phone" && k==="trap" && V){ const O=1-myTeam; V.traps[O][+el.dataset.i] = el.value; sendTrap(O, +el.dataset.i, el.value); }
});
document.addEventListener("keydown", e => { if(e.key==="Enter" && e.target.id==="myname"){ e.preventDefault(); document.querySelector('[data-a="set-name"]')?.click(); } });
document.addEventListener("change", e => { if(ROLE==="host" && e.target.dataset.in==="cfgb") broadcast(); });

/* ============================================================ boot */
(function boot(){
  const qs = new URLSearchParams(location.search);
  const j = (qs.get("join")||"").toLowerCase(), t = qs.get("team");
  const ok = c => /^[a-z0-9]{4,16}$/.test(c||"");
  if(ok(j) && (t==="0"||t==="1")){ phoneJoin(j, +t); return; }
  if(j && !ok(j)) joinErr = "That QR code didn't look right. Scan it again from the iPad.";
  const ph = lsGet(PREFIX+"phone");
  if(!j && ph && ok(ph.code)){ phoneJoin(ph.code, ph.team===1?1:0); return; }
  render();
})();
</script>
